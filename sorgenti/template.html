<style>

.btn{padding:7px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;font:600 .85rem var(--f-body);cursor:pointer}

.tag{font:500 .7rem var(--f-mono);padding:2px 6px;border-radius:4px;background:var(--surface2);color:var(--muted);white-space:nowrap}

.spec{margin:4px 0;font-size:.9rem}

<script>
const BESTIARIO = __BESTIARIO__;
const FD = __FONTI__;
const TALENTI = __TALENTI__;

/* ---------- utilità ---------- */
const mod=v=>Math.floor((v-10)/2);
const sg=n=>(n>=0?'+':'')+n;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=n=>String(n).replace('.',',');
const CONDIZIONI=['Azzoppat','Colt[oaie] alla sprovvista','Offuscat','Affaticat','Abbagliat','Accecat','Accovacciat','Affascinat','Assordat','Barcollant','Confus','Esaust','Frastornat','Immobilizzat','Impreparat','[Ii]n [Ll]otta','Inabil','Incorpore','Indifes','Inferm','Intralciat','Invisibil','Morent','Nauseat','Paralizzat','Scoss','Spaventat','In Preda al Panico','Pietrificat','Priv[oaie] di sensi','Pron[oaie]','Rott','Sanguinant','Scheggiat','Stabilizzat','Stordit','Sempre pront'];
const COND_RE=new RegExp('(?<![\\p{L}])('+CONDIZIONI.join('|')+')([a-z]*)(?![\\p{L}])','giu');
function rich(s){return esc(s).replace(COND_RE,m=>'<span class="cond">'+m+'</span>');}
const RCLS={'comune':'r-comune','non comune':'r-noncomune','raro':'r-raro'};
const CAR=['For','Des','Cos','Int','Sag','Car'];
const CAR_N={For:'Forza',Des:'Destrezza',Cos:'Costituzione',Int:'Intelligenza',Sag:'Saggezza',Car:'Carisma'};
const B=Object.fromEntries(BESTIARIO.map(b=>[b.id,b]));
const F=Object.fromEntries(FD.fonti.map(f=>[f.id,f]));
const TS=Object.fromEntries(TALENTI.selvatici.map(t=>[t.id,t]));

/* Tabella del compagno naturale: liv → DV, BAB, Tem, Rif, Vol, abilità, talenti, armatura naturale, For/Des */
const TAB=[[2,1,3,3,0,2,1,0,0],[3,2,3,3,1,3,2,0,0],[3,2,3,3,1,3,2,1,1],[4,3,4,4,1,4,2,1,1],[5,3,4,4,1,5,3,1,1],[6,4,5,5,2,6,3,2,2],[6,4,5,5,2,6,3,2,2],[7,5,5,5,2,7,4,2,2],[8,6,6,6,2,8,4,3,3],[9,6,6,6,3,9,5,3,3],[9,6,6,6,3,9,5,3,3],[10,7,7,7,3,10,5,4,4],[11,8,7,7,3,11,6,4,4],[12,9,8,8,4,12,6,4,4],[12,9,8,8,4,12,6,5,5],[13,9,8,8,4,13,7,5,5],[14,10,9,9,4,14,7,5,5],[15,11,9,9,5,15,8,6,6],[15,11,9,9,5,15,8,6,6],[16,12,10,10,5,16,8,6,6]]
 .map(r=>({dv:r[0],bab:r[1],t:r[2],r:r[3],v:r[4],ab:r[5],tal:r[6],an:r[7],fd:r[8]}));
const PRIV=[[1,'Legame'],[1,'Cavalcatura'],[1,'Condividere incantesimi'],[2,'Bardatura'],[3,'Eludere'],[6,'Devozione'],[9,'Multiattacco'],[15,'Eludere migliorato']];
/* Modificatori di taglia (Vol. 1, segni di Volare e BMC corretti) */
const TAGLIE=['piccolissima','minuta','minuscola','piccola','media','grande','enorme','mastodontica','colossale'];
const TMOD={piccolissima:[8,8,8,-8],minuta:[4,6,4,-4],minuscola:[2,4,3,-2],piccola:[1,2,2,-1],media:[0,0,0,0],grande:[-1,-2,-2,1],enorme:[-2,-4,-3,2],mastodontica:[-4,-6,-4,4],colossale:[-8,-8,-8,8]};
const tagliaPiu=(t,n)=>TAGLIE[Math.max(0,Math.min(8,TAGLIE.indexOf(t)+n))];
const DADI=['1d2','1d3','1d4','1d6','1d8','2d6','3d6','4d6','6d6','8d6','12d6'];
const DADI_EXTRA={'1d10':'2d8','1d12':'3d6','2d4':'2d6','2d8':'3d8','3d8':'4d8','2d10':'4d8'};
const DADI_GIU={'1d3':'1d2','1d4':'1d3','1d6':'1d4','1d8':'1d6','1d10':'1d8','1d12':'1d10','2d4':'1d6','2d6':'1d8','2d8':'1d10','2d10':'2d8','3d6':'2d6','3d8':'2d8','4d6':'3d6','4d8':'3d8','6d6':'4d6','8d6':'6d6','12d6':'8d6'};
function stepDado(d,n){
  for(let k=0;k<n;k++){const i=DADI.indexOf(d);if(i>=0&&i<DADI.length-1)d=DADI[i+1];else if(DADI_EXTRA[d])d=DADI_EXTRA[d];}
  for(let k=0;k>n;k--){if(DADI_GIU[d])d=DADI_GIU[d];}
  return d;}
const SPAZIO={piccolissima:'0 cs / 0',minuta:'0 cs / 0',minuscola:'0 cs / 0',piccola:'1 cs / 1,5 m',media:'1 cs / 1,5 m',grande:'2×2 cs / 3 m (alta) · 1,5 m (lunga)',enorme:'3×3 cs / 4,5 m (alta) · 3 m (lunga)',mastodontica:'4×4 cs / 6 m (alta) · 4,5 m (lunga)',colossale:'6×6 cs / 9 m (alta) · 6 m (lunga)'};
/* Campi dei modificatori: chiave, etichetta */
const MODCAMPI=[['ca','CA'],['caCont','CA di contatto'],['caImpr','CA impreparato'],['tpc','Tiri per colpire'],['danni','Danni'],['T','Tempra'],['R','Riflessi'],['V','Volontà'],['bmc','BMC'],['dmc','DMC'],['vel','Velocità (m)'],['iniz','Iniziativa'],['taglia','Taglia (passi)']];
function effAttivi(){return (S.effetti||[]).filter(e=>e.attivo);}
function migraEffetti(s){for(const e of (s.effetti||[])){if(e.caNat){e.ca=(+e.ca||0)+e.caNat;e.caImpr=(+e.caImpr||0)+e.caNat;delete e.caNat;}if(e.ca&&e.caCont===undefined&&e.caImpr===undefined&&!e._v2){e.caCont=e.ca;e.caImpr=e.ca;}e._v2=true;}}
function effSomma(k){return effAttivi().reduce((a,e)=>a+(+e[k]||0),0);}
function effCar(k){return effAttivi().reduce((a,e)=>a+(+(e.car||{})[k]||0)+(+(e.carT||{})[k]||0),0);}
const BARD={
  '':{nome:'Nessuna',ca:0,des:99,pen:0,med:false},
  imbottita:{nome:'Gualdrappa imbottita',ca:2,des:4,pen:0,med:false},
  borchie:{nome:'Gualdrappa imbottita con borchie',ca:3,des:4,pen:-1,med:false},
  scaglie:{nome:'Manto di scaglie',ca:5,des:3,pen:-3,med:true},
  maglia:{nome:'Rete di maglia e piastroni',ca:6,des:3,pen:-3,med:true}};
const ABIL=[['Acrobazia','Des'],['Artista della Fuga','Des'],['Furtività','Des'],['Intimidire','Car'],['Nuotare','For'],['Percezione','Sag'],['Scalare','For'],['Sopravvivenza','Sag'],['Volare','Des']];
const GENERICI=[
  {id:'arma_accurata',nome:'Arma Accurata',testo:'Usa il bonus di Destrezza al posto della Forza ai tiri per colpire con le armi naturali.'},
  {id:'arma_focalizzata',nome:'Arma Focalizzata',testo:'+1 ai tiri per colpire con l\'attacco naturale scelto.',sceltaAttacco:true},
  {id:'robustezza',nome:'Robustezza',testo:'+3 PF, +1 PF per DV oltre il 3°.'},
  {id:'schivare',nome:'Schivare',testo:'+1 di schivare alla CA.'},
  {id:'iniziativa',nome:'Iniziativa Migliorata',testo:'+4 all\'iniziativa.'},
  {id:'riflessi',nome:'Riflessi Fulminei',testo:'+2 ai TS su Riflessi.'},
  {id:'tempra',nome:'Tempra Possente',testo:'+2 ai TS su Tempra.'},
  {id:'volonta',nome:'Volontà di Ferro',testo:'+2 ai TS su Volontà.'},
  {id:'attacco_poderoso',nome:'Attacco Poderoso',testo:'Penalità ai tiri per colpire in cambio di danni extra.'}];
const GEN=Object.fromEntries(GENERICI.map(g=>[g.id,g]));
const INSEDIAMENTI=[['Piccolo insediamento','uno comune'],['Borgo','due comuni'],['Villaggio','due comuni e uno non comune'],['Piccolo paese','tre comuni e uno non comune'],['Grande paese','quattro comuni e due non comuni'],['Piccola città','quattro comuni e tre non comuni'],['Grande città','quattro comuni, tre non comuni e uno raro'],['Capitale o metropoli','quattro comuni, tre non comuni e due rari']];
const RIT={'comune':[75,95,25],'non comune':[50,75,50],'raro':[15,25,100]};

/* ---------- stato ---------- */
const DEFAULT={esempio:true,nome:'Esempio — Mirel, druida',taglia:'media',fonti:[{id:'druido',liv:6,simbiosi:false}],livPg:'',ottimo:false,
  creatura:'cane_di_grossa_taglia',sceltaAv:'creatura',aumenti:['For','For','For'],richiamo:'',trovatoAmbiente:false,
  talenti:[{id:'intercettare_pericolo'},{id:'schivare'},{id:'attacco_naturale_migliorato',att:'Morso'}],liberi:'',gradi:{'Percezione':3,'Furtività':2,'Sopravvivenza':1},
  bard:'imbottita',potBard:0,effetti:[{id:'e1',nome:'Amuleto dell\'armatura naturale +1',perm:true,attivo:true,ca:1,caImpr:1,_v2:true},{id:'e2',nome:'Esempio: aumento di taglia',perm:false,attivo:false,taglia:1,carT:{For:2,Des:-2}}],pfManuali:'',danni:{fatica:0,ferita:0},riservaUsata:0,ultimo:'',tab:'compagno',filtri:{q:'',cat:'',rar:'',tipo:'',solo:true},insed:4};
function nuovoPg(n){return JSON.parse(JSON.stringify(Object.assign({},DEFAULT,{esempio:false,nome:n||'Nuovo personaggio',fonti:[{id:'druido',liv:1,simbiosi:false}],creatura:'',talenti:[],gradi:{},bard:'',effetti:[],tab:'padrone'})));}
let G=loadG(), S=G.dati[G.attivo];
function loadG(){
  try{const r=localStorage.getItem('compagni-cavalcature-v1');if(r){const g=JSON.parse(r);if(g&&g.dati&&g.dati[g.attivo])return g;}}catch(e){}
  const id='p'+Date.now();return {attivo:id,dati:{[id]:JSON.parse(JSON.stringify(DEFAULT))}};
}
function save(){G.dati[G.attivo]=S;try{localStorage.setItem('compagni-cavalcature-v1',JSON.stringify(G));}catch(e){}}
function fill(s){for(const k in DEFAULT)if(s[k]===undefined)s[k]=JSON.parse(JSON.stringify(DEFAULT[k]));migraEffetti(s);return s;}
fill(S);

/* ---------- fonti e livello effettivo ---------- */
function statoFonti(){
  const attive=[],ordinanza=[];
  for(const f of S.fonti){
    const X=F[f.id];if(!X)continue;const L=Math.max(1,Math.min(20,+f.liv||1));
    if(L>=X.dal){
      let sc=(X.pienoDal&&L>=X.pienoDal)?0:X.scarto;
      if(f.simbiosi&&X.simbiosi!=null)sc=X.simbiosi;
      attive.push({X,L,e:Math.max(1,L+sc),sc});
    }else if(X.ordinanzaDa&&L>=X.ordinanzaDa)ordinanza.push({X,L});
  }
  return {attive,ordinanza};
}
function livPersonaggio(){const v=+S.livPg;if(v>0)return v;return Math.max(1,S.fonti.reduce((a,f)=>a+(+f.liv||0),0));}
function livelloEff(){
  const {attive,ordinanza}=statoFonti();
  if(!attive.length)return {E:ordinanza.length?1:0,base:0,ordinanza:ordinanza.length>0,attive,ord:ordinanza};
  const base=attive.reduce((a,s)=>a+s.e,0);
  let E=base;
  if(S.ottimo||haTalento('legame_speciale'))E=Math.max(base,Math.min(base+4,livPersonaggio()));
  return {E:Math.min(20,Math.max(1,E)),base,ordinanza:false,attive,ord:ordinanza};
}
function ammessoDa(b,X){
  const a=X.ammessi||{};
  if(b.esclusivo)return !!(a.esclusivi&&a.esclusivi.some(x=>b.esclusivo.includes(x)));
  let ok=false;
  if(a.categorie&&a.categorie.includes(b.categoria))ok=true;
  if(a.tipi&&b.tipi.some(t=>a.tipi.includes(t)))ok=true;
  if(a.nomi&&a.nomi.includes(b.nome))ok=true;
  if(a.nonAcquatico&&b.tipi.includes('acquatico'))ok=false;
  return ok;
}
function ammesso(b){
  const le=livelloEff();
  if(le.ordinanza)return FD.ordinanza.includes(b.nome);
  if(!le.attive.length)return false;
  return le.attive.every(s=>ammessoDa(b,s.X));
}
const nuovoMondo=()=>statoFonti().attive.find(s=>s.X.titanica);

/* ---------- talenti ---------- */
function talentiBonus(E,b,le){
  const out=[];
  if(!le.ordinanza&&E>=2&&b&&b.categoria!=='vegetale')out.push({nome:'Addestramento nelle bardature leggere',da:'Bardatura'});
  if(E>=9)out.push({nome:'Multiattacco',da:'Tabella del compagno (9°)'});
  if(b)for(const s of b.speciali.concat(avanzamentoAttivo(b,E)?b.avanzamento.speciali:[])){const m=s.match(/[Oo]ttiene (.+?) come talento bonus/);if(m)out.push({nome:m[1],da:'Creatura'});}
  for(const s of le.attive)for(const t of (s.X.talentiBonus||[]))if(s.L>=t.liv)out.push({nome:t.nome,da:s.X.nome});
  return out;
}
const haTalento=id=>S.talenti.some(t=>t.id===id);
function nomiTalenti(){const E=livelloEff().E,b=B[S.creatura];return S.talenti.map(t=>(TS[t.id]||GEN[t.id]||{}).nome||'').concat(talentiBonus(E,b,livelloEff()).map(t=>t.nome)).map(n=>n.toLowerCase());}
function requisiti(t,c){
  const r=t.requisiti||'';const out=[];if(!r)return out;const nomi=nomiTalenti();
  let m;
  if((m=r.match(/Bonus di attacco base \+(\d+)/))&&c.bab<+m[1])out.push('BAB +'+m[1]);
  if(/Taglia grande o superiore/.test(r)&&TAGLIE.indexOf(c.taglia)<5)out.push('taglia grande');
  if(/Taglia enorme o superiore/.test(r)&&TAGLIE.indexOf(c.taglia)<6)out.push('taglia enorme');
  if((m=r.match(/Personaggio di (\d+)° livello/))&&livPersonaggio()<+m[1])out.push('personaggio di '+m[1]+'° livello');
  if((m=r.match(/Forza (\d+)/))&&c.car.For<+m[1])out.push('Forza '+m[1]);
  if(/Privilegio di classe Devozione/.test(r)&&c.E<6)out.push('Devozione (6°)');
  if(/Privilegio di classe Eludere/.test(r)&&c.E<3)out.push('Eludere (3°)');
  if(/Tre o più attacchi naturali/.test(r)&&c.nAtt<3)out.push('tre attacchi naturali');
  if(/non acquatico/.test(r)&&c.b.tipi.includes('acquatico'))out.push('non acquatico');
  if(/tipo animale o parassita/.test(r)&&c.b.categoria==='vegetale')out.push('animale o parassita');
  if(/Possedere almeno un attacco speciale/.test(r)&&!c.b.speciali.length)out.push('un attacco speciale');
  if(/quattro o più zampe/.test(r))out.push('?quattro zampe');
  for(const mm of r.matchAll(/(Acrobazia|Furtività|Percezione|Intimidire|Raggirare) (\d+) grad[oi]/g))if((S.gradi[mm[1]]||0)<+mm[2])out.push(mm[1]+' '+mm[2]+' gradi');
  for(const n of ['Attento','Intercettare pericolo','Carica potente','Attacco poderoso','Spingere migliorato','Arma accurata','Addestramento nelle bardature leggere','Intesa perfetta']){
    const re=new RegExp('(^|[;,:] ?)'+n+'(?! migliorat)','i');
    if(re.test(r)&&!nomi.includes(n.toLowerCase())&&t.nome!==n)out.push(n);
  }
  return out;
}

/* ---------- motore del compagno ---------- */
function avanzamentoAttivo(b,E){return b.avanzamento&&b.avanzamento.livello&&E>=b.avanzamento.livello&&S.sceltaAv!=='car';}
function calcola(){
  const le=livelloEff(), E=le.E, b=B[S.creatura];
  if(!E||!b)return null;
  const row=TAB[E-1];
  let taglia=b.taglia, can=b.ca_nat||0, car={...b.car}, att=b.attacchi, vel={...b.velocita}, spec=[...b.speciali], altri=[...(b.altro||[])];
  const av=b.avanzamento||{};
  const avOn=av.livello&&E>=av.livello;
  if(avOn){
    if(S.sceltaAv==='car'){car.Des+=2;car.Cos+=2;}
    else{
      if(av.taglia)taglia=av.taglia; can+=av.ca_nat||0;
      for(const k in (av.mod_car||{}))car[k]=(car[k]||0)+av.mod_car[k];
      if(av.attacchi&&av.attacchi.length)att=av.attacchi;
      if(av.velocita)Object.assign(vel,av.velocita);
      spec=spec.concat(av.speciali||[]); altri=altri.concat(av.altro||[]);
    }
  }
  car.For+=row.fd; car.Des+=row.fd;
  const nAum=[8,13,20].filter(x=>E>=x).length;
  for(let i=0;i<nAum;i++){const k=S.aumenti[i]||'For';car[k]=(car[k]||0)+1;}
  for(const s of le.attive)for(const k in (s.X.bonusCar||{}))car[k]+=s.X.bonusCar[k];
  if(S.richiamo&&car[S.richiamo]!=null)car[S.richiamo]+=2;
  let stepTit=0;const nm=nuovoMondo();
  if(nm&&nm.L>=9){taglia=tagliaPiu(taglia,1);stepTit=1;const n=[9,13,17].filter(x=>nm.L>=x).length;car.For+=2*n;car.Cos+=2*n;}
  const tagliaNat=taglia, passiEff=effSomma('taglia');
  if(passiEff){const i0=TAGLIE.indexOf(taglia);taglia=tagliaPiu(taglia,passiEff);stepTit+=TAGLIE.indexOf(taglia)-i0;}
  for(const k of CAR)if(car[k]!=null)car[k]+=effCar(k);
  const M=Object.fromEntries(CAR.map(k=>[k,car[k]==null?0:mod(car[k])]));
  const tm=TMOD[taglia]||TMOD.media;
  const tmCMB=haTalento('massiccio')?(TMOD[tagliaPiu(taglia,1)]||tm)[3]:tm[3];
  // PF
  const dv=row.dv;
  let pfAuto=8+5*(dv-1)+M.Cos*dv; if(haTalento('robustezza'))pfAuto+=3+Math.max(0,dv-3);
  let pf=S.pfManuali!==''&&+S.pfManuali>0?+S.pfManuali:pfAuto;
  const falc=le.attive.find(s=>s.X.metaPFfinoA&&s.L<=s.X.metaPFfinoA);
  if(falc)pf=Math.floor(pf/2);
  pf=Math.max(1,pf);
  const fatica=Math.floor(pf/2), ferita=pf-fatica;
  // bardatura
  const bd=(b.categoria==='vegetale'||le.ordinanza&&false)?BARD['']:(BARD[S.bard]||BARD['']);
  const nomiT=nomiTalenti();
  const puoMedia=nomiT.includes('addestramento nelle bardature medie');
  const puoLeggera=nomiT.includes('addestramento nelle bardature leggere');
  let bardOk=!S.bard||(bd.med?puoMedia:puoLeggera);
  const bdEff=bardOk?bd:BARD[''];
  const desCA=Math.min(M.Des,bdEff.des);
  const schiv=haTalento('schivare')?1:0;
  const nat=can+row.an;
  const potB=bdEff.ca?(+S.potBard||0):0;
  const CA=10+desCA+tm[0]+nat+bdEff.ca+potB+schiv+effSomma('ca');
  const contatto=10+desCA+tm[0]+schiv+effSomma('caCont');
  const impreparato=10+Math.min(0,desCA)+tm[0]+nat+bdEff.ca+potB+effSomma('caImpr');
  // TS
  let bonusTS=0;for(const s of le.attive)bonusTS+=s.X.bonusTS||0;
  if(S.trovatoAmbiente&&le.attive.some(s=>s.X.addestratore))bonusTS+=1;
  const prim=nm&&nm.L>=14?3:0;
  const ts={T:row.t+M.Cos+bonusTS+prim+(haTalento('tempra')?2:0)+effSomma('T'),R:row.r+M.Des+bonusTS+prim+(haTalento('riflessi')?2:0)+effSomma('R'),V:row.v+M.Sag+bonusTS+(haTalento('volonta')?2:0)+effSomma('V')};
  const devo=E>=6?(nm&&nm.L>=14?6:4):0;
  // attacchi
  const accurata=haTalento('arma_accurata');
  const fAtt=accurata?Math.max(M.For,M.Des):M.For;
  const multi=E>=9||haTalento('multiattacco');
  const focal=S.talenti.filter(t=>t.id==='arma_focalizzata').map(t=>t.att);
  const migl=S.talenti.filter(t=>t.id==='attacco_naturale_migliorato').map(t=>t.att);
  const gruppi=att.map(g=>{
    const nat=g.filter(a=>a.dado||a.nota);
    const tot=nat.reduce((a,x)=>a+(x.n||1),0);
    let righe=[];
    for(const a of g){
      if(!a.dado&&!a.nota){righe.push({testo:a.testo||a.nome});continue;}
      const sec=!!a.secondario;
      let penSec=sec?(multi&&tot>=3?-2:-5):0;
      let dado=a.dado; if(dado){dado=stepDado(dado,stepTit+migl.filter(x=>x===a.nome).length);}
      let molt=sec?.5:(tot===1?1.5:1);
      if(/mezzo il bonus di Forza/.test((a.nota||'')+(a.extra||'')))molt=1.5;
      const dmgMod=M.For>0?Math.floor(M.For*molt):(sec?Math.floor(M.For/2):M.For);
      const tpc=row.bab+(a.dado?fAtt:M.Des)+tm[0]+penSec+(focal.includes(a.nome)?1:0)+effSomma('tpc');
      const dadoNota=!a.dado&&a.nota?(a.nota.match(/(\d+d\d+)/)||[])[1]:null;
      const dm=dmgMod+(dado?effSomma('danni'):0);
      const danno=dado?dado+(dm?sg(dm):''):(dadoNota||'—');
      const piu=a.extra?a.extra.replace(/^una volta e mezzo il bonus di Forza$/,''):'';
      let nota=a.dado&&a.nota?a.nota.replace(/^\+?1? ?volta e mezzo il bonus di Forza/,'').trim():'';
      const suff=nota?(/^\/?\d/.test(nota)?(nota.startsWith('/')?nota:'/'+nota):' '+nota):'';
      const extra=!a.dado?[a.nota,a.extra].filter(Boolean).join(', '):'';
      righe.push({nome:(a.n>1?a.n+' ':'')+a.nome,tpc,danno:danno+suff+(piu?' più '+piu:''),extra,sec,dist:!a.dado});
    }
    if(multi&&tot<3){const p=righe.find(r=>r.nome&&!r.sec&&!r.dist);if(p)righe.push({...p,nome:p.nome.replace(/^\d+ /,'')+' (Multiattacco)',tpc:p.tpc-5,extra:p.extra});}
    return righe;
  });
  const nAtt=att.length?att[0].reduce((a,x)=>a+((x.dado||x.nota)?(x.n||1):0),0):0;
  const bmc=row.bab+M.For+tmCMB+effSomma('bmc'), dmc=10+row.bab+M.For+M.Des+tmCMB+effSomma('dmc');
  // velocità
  const velE={...vel}; if(bdEff.med&&velE.terra)velE.terra=Math.max(1.5,velE.terra-3);
  if(effSomma('vel')&&velE.terra!=null)velE.terra=Math.max(0,velE.terra+effSomma('vel'));
  // abilità
  const punti=row.ab+(M.Int>0?M.Int*dv:0);
  const speso=ABIL.reduce((a,[n])=>a+(+S.gradi[n]||0),0);
  const velBonus={Nuotare:vel.nuotare?8:0,Scalare:vel.scalare?8:0,Volare:vel.volare?8:0};
  const abil=ABIL.map(([n,k])=>{
    const g=+S.gradi[n]||0;
    let t=g+M[k]+(g>0?3:0)+(velBonus[n]||0);
    if(n==='Furtività')t+=tm[1]; if(n==='Volare')t+=tm[2];
    if(['Acrobazia','Artista della Fuga','Furtività','Nuotare','Scalare','Volare'].includes(n))t+=bdEff.pen;
    if(n==='Percezione'&&haTalento('attento'))t+=2;
    return {n,k,g,t,troppi:g>dv};
  });
  // privilegi
  const noCond=le.ordinanza||le.attive.some(s=>s.X.noCondividere);
  const priv=PRIV.filter(([l,n])=>E>=l&&!(le.ordinanza&&(n==='Legame'||n==='Condividere incantesimi'))&&!(noCond&&n==='Condividere incantesimi')&&!(n==='Bardatura'&&b.categoria==='vegetale')&&!(n==='Cavalcatura'&&b.categoria==='vegetale')).map(([l,n])=>n);
  if(avOn)priv.push(S.sceltaAv==='car'?'Avanzamento: +2 Destrezza e +2 Costituzione':'Avanzamento della creatura ('+av.livello+'°)');
  for(let i=0;i<nAum;i++)priv.push('Aumento di caratteristica: +1 '+(S.aumenti[i]||'For'));
  // fonti: resistenze e note
  const extra=[];
  for(const s of le.attive){
    for(const r of (s.X.resistenze||[]))if(s.L>=r.liv)extra.push(r.testo);
    if(s.X.ri&&s.L>=s.X.ri.dal)extra.push('RI '+(s.X.ri.base+s.L));
    if(s.X.rd&&s.L>=s.X.rd.dal)extra.push('RD '+(s.X.rd.base+Math.floor((s.L-s.X.rd.dal)/s.X.rd.ogni))+'/'+s.X.rd.tipo);
  }
  const note=[];for(const s of le.attive.concat(le.ord))for(const n of (s.X.note||[]))if(s.L>=n.liv)note.push({fonte:s.X.nome,testo:n.testo});
  // CD nelle capacità
  const cd=k=>10+Math.floor(dv/2)+(M[{Forza:'For',Destrezza:'Des',Costituzione:'Cos',Saggezza:'Sag',Carisma:'Car',carisma:'Car'}[k]]||0);
  const specCD=spec.map(s=>s.replace(/CD 10 \+ metà DV \+ bonus di (Forza|Destrezza|Costituzione|Saggezza|Carisma|carisma)\)?/g,(m,k)=>'CD '+cd(k)));
  const warn=[];
  if(!bardOk)warn.push('La bardatura scelta richiede '+(bd.med?'Addestramento nelle bardature medie':'Addestramento nelle bardature leggere')+': non è applicata.');
  if(!ammesso(b))warn.push('Questa creatura non è ammessa dalle fonti attive.');
  if(le.attive.some(s=>s.X.ammessi&&s.X.ammessi.cavalcabile)&&TAGLIE.indexOf(taglia)<=TAGLIE.indexOf(S.taglia))warn.push('Per essere cavalcata la creatura deve essere di taglia superiore al padrone.');
  if(speso>punti)warn.push('Gradi di abilità assegnati: '+speso+' su '+punti+'.');
  const nTal=S.talenti.length, maxTal=row.tal;
  if(nTal>maxTal)warn.push('Talenti scelti: '+nTal+' su '+maxTal+'.');
  return {E,le,b,row,taglia,can,nat,car,M,tm,pf,pfAuto,fatica,ferita,falc:!!falc,CA,contatto,impreparato,ts,devo,gruppi,nAtt,bmc,dmc,vel:velE,punti,speso,abil,priv,extra,note,spec:specCD,altri,warn,bd:bdEff,bardOk,maxTal,iniz:M.Des+(haTalento('iniziativa')?4:0)+effSomma('iniz'),avOn,dv,bab:row.bab,tagliaNat,spazio:SPAZIO[taglia]||'',nEff:effAttivi().length};
}

        document.querySelectorAll('[data-a]').forEach(x=>x.addEventListener('click',()=>{S.talenti.push({id,att:x.dataset.a});save();closeModal();render();}));

function testoScheda(c){
  const b=c.b;const L=[];
  L.push(b.nome+' — '+(c.le.ordinanza?'cavalcatura d\'ordinanza':'compagno di '+c.E+'° livello')+', '+c.dv+' DV, taglia '+c.taglia);
  L.push('PF '+c.pf+' (Fatica '+c.fatica+', Ferita '+c.ferita+'); CA '+c.CA+', contatto '+c.contatto+', impreparato '+c.impreparato+'; Iniziativa '+sg(c.iniz));
  L.push('Tempra '+sg(c.ts.T)+', Riflessi '+sg(c.ts.R)+', Volontà '+sg(c.ts.V)+(c.devo?' (+'+c.devo+' contro ammaliamento)':''));
  L.push('BAB '+sg(c.bab)+'; BMC '+sg(c.bmc)+'; DMC '+c.dmc+'; Velocità '+velTesto(c.vel));
  c.gruppi.forEach((g,i)=>L.push((i?'Oppure: ':'Attacchi: ')+g.filter(r=>r.nome).map(r=>r.nome+' '+sg(r.tpc)+' ('+r.danno+(r.extra?', '+r.extra:'')+')').join(', ')));
  L.push('Caratteristiche: '+CAR.map(k=>k+' '+(c.car[k]??'—')).join(', '));
  L.push('Abilità: '+c.abil.filter(a=>a.g>0).map(a=>a.n+' '+sg(a.t)).join(', '));
  L.push('Talenti: '+talentiBonus(c.E,b,c.le).map(t=>t.nome).concat(S.talenti.map(t=>((TS[t.id]||GEN[t.id]||{}).nome||'')+(t.att?' ('+t.att+')':''))).concat(S.liberi?[S.liberi]:[]).join(', '));
  if(c.extra.length)L.push('Difese: '+c.extra.join('; '));
  L.push('Privilegi: '+c.priv.join(', '));
  if(c.spec.length)L.push('Capacità: '+c.spec.join(' '));
  return L.join('\n');
}
function copiaScheda(c){
  const t=testoScheda(c);
  const fall=()=>modal('<div class="card"><div class="sheetHead"><h2>Scheda in testo</h2><button class="btn sm" data-close>Chiudi</button></div><textarea id="ta" style="width:100%;min-height:50vh;margin-top:10px;font:.85rem var(--f-mono);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px">'+esc(t)+'</textarea></div>');
  try{navigator.clipboard.writeText(t).then(()=>toast('Scheda copiata'),fall);}catch(e){fall();}
}


/* ----- attacchi ----- */
function attHtml(c){
  return '<div class="atk">'+c.gruppi.map((g,i)=>(c.gruppi.length>1?'<div class="alt">'+(i?'oppure':'Attacchi')+'</div>':'')+g.map(r=>r.nome?
    '<div class="l"><span>'+esc(r.nome)+(r.sec?' <span class="tag">secondario</span>':'')+(r.extra?'<br><span class="note">'+rich(r.extra)+'</span>':'')+'</span><span>'+sg(r.tpc)+' ('+rich(r.danno)+')</span></div>'
    :'<div class="l"><span>'+esc(r.testo)+'</span><span></span></div>').join('')).join('')+'</div>';
}

/* ----- modificatori ----- */
function riassuntoEff(e){
  const p=[];
  for(const [k,l] of MODCAMPI)if(+e[k])p.push(l.replace(' (m)','').replace(' (passi)','')+' '+sg(+e[k])+(k==='vel'?' m':''));
  for(const k of CAR){const v=(+(e.car||{})[k]||0)+(+(e.carT||{})[k]||0);if(v)p.push(k+' '+sg(v));}
  return p.join(', ')||'nessun valore';
}
function apriModificatori(){
  S.effetti=S.effetti||[];
  const blocco=(perm)=>{
    const l=S.effetti.map((e,i)=>({e,i})).filter(x=>!!x.e.perm===perm);
    return '<h3 style="margin:14px 0 6px">'+(perm?'Permanenti (oggetti magici e simili)':'Temporanei (incantesimi ed effetti)')+'</h3><div class="list">'+
      (l.length?l.map(({e,i})=>'<div class="featRow"><label class="check" style="flex:1"><input type="checkbox" data-att="'+i+'"'+(e.attivo?' checked':'')+'><span><b>'+esc(e.nome)+'</b><br><span class="note">'+esc(riassuntoEff(e))+'</span></span></label><button class="btn sm" data-ed="'+i+'">Modifica</button></div>').join(''):'<p class="note">Nessuno.</p>')+
      '</div><button class="btn sm" data-nuovo="'+(perm?1:0)+'" style="margin-top:8px">Aggiungi '+(perm?'permanente':'temporaneo')+'</button>';
  };
  modal('<div class="card"><div class="sheetHead"><h2>Modificatori</h2><button class="btn sm" data-close>Chiudi</button></div><p class="note">Si sommano ai valori della scheda. Le tre CA sono separate: un bonus di deviazione, per esempio, va messo su tutte e tre; un bonus di armatura naturale su CA e impreparato. La taglia sposta anche i dadi di danno e i modificatori di taglia; le caratteristiche dovute al cambio di taglia si scelgono a mano.</p>'+blocco(false)+blocco(true)+
    (S.effetti.some(e=>!e.perm&&e.attivo)?'<div class="row" style="margin-top:14px"><button class="btn" id="spegni">Disattiva tutti i temporanei</button></div>':'')+'</div>');
  document.querySelectorAll('[data-att]').forEach(x=>x.addEventListener('change',()=>{S.effetti[+x.dataset.att].attivo=x.checked;save();render();apriModificatori();}));
  document.querySelectorAll('[data-ed]').forEach(x=>x.addEventListener('click',()=>editaEffetto(+x.dataset.ed)));
  document.querySelectorAll('[data-nuovo]').forEach(x=>x.addEventListener('click',()=>{S.effetti.push({id:'e'+Date.now(),nome:x.dataset.nuovo==='1'?'Nuovo oggetto':'Nuovo effetto',perm:x.dataset.nuovo==='1',attivo:true,car:{},carT:{}});save();editaEffetto(S.effetti.length-1);}));
  bind('spegni','click',()=>{S.effetti.forEach(e=>{if(!e.perm)e.attivo=false;});save();render();apriModificatori();});
}
function editaEffetto(i){
  const e=S.effetti[i];e.car=e.car||{};e.carT=e.carT||{};
  const inp=(id,v,lab)=>'<div class="field"><label class="label" for="'+id+'">'+lab+'</label><input id="'+id+'" type="number" value="'+(+v||0)+'"></div>';
  let h='<div class="card"><div class="sheetHead"><h2>'+(e.perm?'Modificatore permanente':'Modificatore temporaneo')+'</h2><button class="btn sm" id="edOk">Fatto</button></div>'+
    '<div class="grid" style="margin-top:10px"><div class="field" style="grid-column:1/-1"><label class="label" for="ed-nome">Nome</label><input id="ed-nome" value="'+esc(e.nome)+'"></div>'+
    '<label class="check" style="grid-column:1/-1"><input type="checkbox" id="ed-att"'+(e.attivo?' checked':'')+'><span>Attivo</span></label>'+
    '<label class="check" style="grid-column:1/-1"><input type="checkbox" id="ed-perm"'+(e.perm?' checked':'')+'><span>Permanente (oggetto magico o effetto di lunga durata)</span></label></div>'+
    '<h3 style="margin:14px 0 6px">Valori</h3><div class="grid">'+MODCAMPI.map(([k,l])=>inp('ed-'+k,e[k],l)).join('')+'</div>'+
    '<h3 style="margin:14px 0 6px">Caratteristiche dovute al cambio di taglia</h3><div class="grid">'+['For','Des','Cos'].map(k=>inp('ed-t'+k,e.carT[k],CAR_N[k])).join('')+'</div>'+
    '<h3 style="margin:14px 0 6px">Altre modifiche alle caratteristiche</h3><div class="grid">'+CAR.map(k=>inp('ed-c'+k,e.car[k],CAR_N[k])).join('')+'</div>'+
    '<div class="row" style="margin-top:14px"><button class="btn pri" id="edOk2">Salva</button><button class="btn danger" id="edDel">Elimina</button></div></div>';
  modal(h);
  const salva=()=>{
    e.nome=document.getElementById('ed-nome').value||'Senza nome';
    e.attivo=document.getElementById('ed-att').checked;e.perm=document.getElementById('ed-perm').checked;
    for(const [k] of MODCAMPI)e[k]=+document.getElementById('ed-'+k).value||0;
    for(const k of ['For','Des','Cos'])e.carT[k]=+document.getElementById('ed-t'+k).value||0;
    for(const k of CAR)e.car[k]=+document.getElementById('ed-c'+k).value||0;
    save();render();apriModificatori();
  };
  bind('edOk','click',salva);bind('edOk2','click',salva);
  bind('edDel','click',()=>{S.effetti.splice(i,1);save();render();apriModificatori();});
}

/* ----- In gioco ----- */
function rGioco(){
  const c=calcola();
  if(!c){main.innerHTML='<section class="panel"><div class="card"><h2>Nessun compagno</h2><p class="txt">Scegli prima un compagno.</p></div></section>';return;}
  const d=S.danni;d.fatica=Math.min(d.fatica,c.fatica);
  const fat=c.fatica-d.fatica, fer=c.ferita-d.ferita, ris=Math.max(0,c.dv-(+S.riservaUsata||0));
  let h='<section class="panel"><div class="stats"><div class="stat"><span class="label">Punti Fatica</span><b>'+fat+' / '+c.fatica+'</b></div><div class="stat"><span class="label">Punti Ferita</span><b>'+fer+' / '+c.ferita+'</b></div><div class="stat"><span class="label">Rifiatare</span><b>'+ris+' d8</b></div></div>';
  h+='<div class="card"><div class="grid" style="grid-template-columns:1fr"><div><span class="label">Fatica</span><div class="bar"><i class="fat" style="width:'+(c.fatica?100*fat/c.fatica:0)+'%"></i></div></div><div><span class="label">Ferita</span><div class="bar"><i class="'+(fer<=c.ferita/2?'low':'')+'" style="width:'+(c.ferita?100*fer/c.ferita:0)+'%"></i></div></div></div>';
  h+='<div class="row" style="margin-top:12px"><div class="hp"><label class="label" for="g-n">Quantità</label><input id="g-n" type="number" min="1" value="5"></div><button class="btn danger" id="g-d">Danni</button><button class="btn" id="g-c">Cura magica</button></div>';
  h+='<div class="row" style="margin-top:10px"><button class="btn" id="g-r"'+(ris?'':' disabled')+'>Rifiatare (1d8)</button>'+(S.ultimoRif&&!S.ultimoRif.ritirato?'<button class="btn" id="g-rr">Ritira l\'ultimo dado</button>':'')+'<button class="btn" id="g-8">Riposo di 8 ore</button></div>';
  if(S.ultimo)h+='<p class="note" style="margin-top:8px">'+esc(S.ultimo)+'</p>';
  h+='<p class="note">I danni tolgono prima i Punti Fatica. Le cure magiche ridanno prima i Punti Ferita. Rifiatare ridà solo Punti Fatica, pari al dado tirato; «Ritira» serve per oggetti o capacità che permettono di ripetere il tiro (una volta). Il riposo di 8 ore ripristina Fatica e riserva e ridà '+c.dv+' Punti Ferita.</p></div>';
  const eff=S.effetti||[];
  h+='<div class="card"><div class="sheetHead"><h2>Modificatori</h2><button class="btn sm pri" id="modBtn">Gestisci</button></div>'+(eff.length?'<div class="chips">'+eff.map((e,i)=>'<button class="chip" data-tog="'+i+'" aria-pressed="'+!!e.attivo+'">'+esc(e.nome)+(e.perm?' · perm.':'')+'</button>').join('')+'</div><p class="note">Tocca un modificatore per attivarlo o disattivarlo. I valori sotto li includono già.</p>':'<p class="note">Nessun modificatore. Aggiungi incantesimi, effetti o oggetti magici con Gestisci.</p>')+'</div>';
  h+='<div class="card"><h2>Difese e manovre</h2><div class="kv k3">'+
    '<div><small>CA</small><b>'+c.CA+'</b></div><div><small>Contatto</small><b>'+c.contatto+'</b></div><div><small>Impreparato</small><b>'+c.impreparato+'</b></div>'+
    '<div><small>Tempra</small><b>'+sg(c.ts.T)+'</b></div><div><small>Riflessi</small><b>'+sg(c.ts.R)+'</b></div><div><small>Volontà</small><b>'+sg(c.ts.V)+'</b>'+(c.devo?'<small>+'+c.devo+' contro ammaliamento</small>':'')+'</div>'+
    '<div><small>BMC</small><b>'+sg(c.bmc)+'</b></div><div><small>DMC</small><b>'+c.dmc+'</b></div><div><small>Iniziativa</small><b>'+sg(c.iniz)+'</b></div>'+
    '<div style="grid-column:1/-1"><small>Velocità · taglia '+c.taglia+'</small><b style="font-size:.95rem">'+esc(velTesto(c.vel))+'</b></div>'+
    '</div>'+(c.extra.length?'<p class="txt"><b>Difese:</b> '+esc(c.extra.join('; '))+'</p>':'')+'</div>';
  h+='<div class="card"><h2>Attacchi</h2>'+attHtml(c)+'</div></section>';
  main.innerHTML=h;
  bind('modBtn','click',()=>apriModificatori());
  main.querySelectorAll('[data-tog]').forEach(el=>el.addEventListener('click',()=>{const e=S.effetti[+el.dataset.tog];e.attivo=!e.attivo;save();render();}));
  const q=()=>Math.max(0,+document.getElementById('g-n').value||0);
  bind('g-d','click',()=>{let n=q();const a=Math.min(n,c.fatica-d.fatica);d.fatica+=a;n-=a;d.ferita+=n;S.ultimo='Subiti '+q()+' danni.';if(d.ferita>c.ferita)S.ultimo+=' Punti Ferita sotto zero: '+(c.ferita-d.ferita)+'.';save();rGioco();});
  bind('g-c','click',()=>{let n=q();const a=Math.min(n,d.ferita);d.ferita-=a;n-=a;d.fatica=Math.max(0,d.fatica-n);S.ultimo='Curati '+q()+' PF.';save();rGioco();});
  const rif=(r)=>{const prima=d.fatica;d.fatica=Math.max(0,d.fatica-r);S.ultimoRif={r,rec:prima-d.fatica,ritirato:false};S.ultimo='Rifiatare: 1d8 = '+r+' → +'+(prima-d.fatica)+' Punti Fatica.';};
  bind('g-r','click',()=>{rif(1+Math.floor(Math.random()*8));S.riservaUsata=(+S.riservaUsata||0)+1;save();rGioco();});
  bind('g-rr','click',()=>{const u=S.ultimoRif;if(!u||u.ritirato)return;d.fatica+=u.rec;const vecchio=u.r;rif(1+Math.floor(Math.random()*8));S.ultimoRif.ritirato=true;S.ultimo='Ritirato ('+vecchio+' scartato). '+S.ultimo;save();rGioco();});
  bind('g-8','click',()=>{S.ultimoRif=null;d.fatica=0;d.ferita=Math.max(0,d.ferita-c.dv);S.riservaUsata=0;S.ultimo='Riposo di 8 ore completato.';save();rGioco();});
}

/* ---------- finestre ---------- */
function modal(h){const m=document.getElementById('modal');m.innerHTML='<div class="overlay" id="ov">'+h+'</div>';m.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeModal));document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeModal();});}
function closeModal(){document.getElementById('modal').innerHTML='';}
function conferma(testo,ok,fn){modal('<div class="card"><p>'+esc(testo)+'</p><div class="row"><button class="btn danger" id="okC">'+ok+'</button><button class="btn" data-close>Annulla</button></div></div>');document.getElementById('okC').addEventListener('click',()=>{closeModal();fn();});}
function toast(t){const e=document.createElement('div');e.textContent=t;e.setAttribute('role','status');e.style.cssText='position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.85rem;z-index:30';document.body.appendChild(e);setTimeout(()=>e.remove(),1800);}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

pgSel();setTab(S.tab||'compagno');
</script>
